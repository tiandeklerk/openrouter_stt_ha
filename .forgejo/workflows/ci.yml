name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker
    strategy:
      matrix:
        # pytest-homeassistant-custom-component 0.13.109 is the newest
        # release that still supports Python 3.11 (0.13.110+ requires
        # 3.12+); it carries HA 2024.3.3, whose aiohttp test-client mock
        # doesn't support the async context manager protocol used in
        # stt.py, so 3.11 fails regardless of pinning. Test 3.12+ only.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install pytest pytest-homeassistant-custom-component
          # aiodns/pycares spawns a background DNS-resolver shutdown thread
          # that trips pytest-homeassistant-custom-component's thread-leak
          # assertion on Python 3.12 (AssertionError: Lingering thread
          # ..._run_safe_shutdown_loop). It's pulled in transitively by
          # homeassistant but unused by this integration's tests (aiohttp
          # falls back to its default resolver without it).
          pip uninstall -y aiodns pycares
      - name: Run tests
        run: pytest tests/ -v
